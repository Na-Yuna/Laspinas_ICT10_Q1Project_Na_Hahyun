<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gods Shop</title>


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
                rel="stylesheet">

    <!-- PyScript -->
    <link rel="stylesheet"
          href="https://pyscript.net/releases/2025.2.2/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2025.2.2/core.js">
    </script>

    <style>
        /* Body */
        body {
            background: linear-gradient(135deg, #de3f3f, #ac1923);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Navigation Bar */
        nav {
            background-color: #212529;
            height: 45px;
            padding: 0 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 12px;
        }

        .nav-links a:hover {
            color: #ff6b6b;
        }

        .container {
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .main-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }


        .header {
            background: #212529;
            color: white;
            padding: 30px;
            text-align: center;
        }


        .info-card {
            border: none;
            border-radius: 15px;
            transition: transform 0.2s;
            margin-bottom: 15px;
        }


        .info-card:hover {
            transform: translateY(-5px);
        }


        .info-title {
            color: #de3f3f;
            font-weight: bold;
        }


        .data-value {
            font-size: 1.1rem;
        }


        .badge-custom {
            background-color: #de3f3f;
        }


        .order-button {
            background: linear-gradient(90deg, #de3f3f, #ac1923);
            border: none;
            color: white;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }


        .order-button:hover {
            opacity: 0.9;
        }


        #show {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
        }


        footer {
            text-align: center;
            color: white;
            margin-top: 30px;
        }

        input[type="checkbox"] {
        /* This changes the color when the checkbox is clicked/checked */
        accent-color: #de3f3f; 
        }
    </style>

</head>


<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">The Human Market</div>

        <div class="nav-links">
            <a href="SKU generator (Project).html">▦ SKU Generator</a>
            <a href="Receipt generator (SKILLS TEST).html">◉ Receipt Generator</a>
        </div>
    </nav>


    <div class="container">

        <div class="card main-card">


            <!-- Header -->
            <div class="header">
                <h1>The Human Market</h1>
                <p class="mb-0">Choose • Assemble • Create</p>
            </div>


            <!-- Menu -->
            <div class="card-body p-4">
                <h3>☷ Menu</h3>
                <div class="row g-3">

                    <!-- Heart -->
                    <div class="col-12">
                        <div class="card info-card shadow-sm p-3">
                            <label class="d-flex justify-content-between">
                                <span>
                                    <input type="checkbox" id="item1" value="56000000">
                                    Heart
                                </span>
                                <span>₱56,000,000</span>
                            </label>
                        </div>
                    </div>

                    <!-- Brain -->
                    <div class="col-12">
                        <div class="card info-card shadow-sm p-3">
                            <label class="d-flex justify-content-between">
                                <span>
                                    <input type="checkbox" id="item2" value="56000">
                                    Brain
                                </span>
                                <!-- Price -->
                                <span>₱56,000</span>
                            </label>
                        </div>
                    </div>

                    <!-- Lung -->
                    <div class="col-12">
                        <div class="card info-card shadow-sm p-3">
                            <label class="d-flex justify-content-between">
                                <span>
                                    <input type="checkbox" id="item3" value="17000000">
                                    Lung
                                </span>
                                <!-- Price -->
                                <span>₱17,000,000</span>
                            </label>
                        </div>
                    </div>

                    <!-- Kidney -->
                    <div class="col-12">
                        <div class="card info-card shadow-sm p-3">
                            <label class="d-flex justify-content-between">
                                <span>
                                    <input type="checkbox" id="item4" value="14500000">
                                    Kidney
                                </span>
                                <!-- Price -->
                                <span>₱14,500,000</span>
                            </label>
                        </div>
                    </div>

                    <!-- Liver -->
                    <div class="col-12">
                        <div class="card info-card shadow-sm p-3">
                            <label class="d-flex justify-content-between">
                                <span>
                                    <input type="checkbox" id="item5" value="1000000">
                                    Liver
                                </span>
                                <!-- Price -->
                                <span>₱1,000,000</span>
                            </label>
                        </div>
                    </div>

                </div>

                <!-- Create Order Button -->
                <button class="order-button" py-click="create_order">
                    ▣ &nbsp; Create Order
                </button>
            
                <!-- Line -->
                <hr class="border-3 opacity-75">

                <!-- Receipt -->
                <div id="show">
                    <p>Your order summary will appear here.</p>
                </div>

            </div>
        </div>

        <!-- Footer -->
        <footer>
            <p>
                &lt;/&gt; SKU Generator - 1st Quarter Project
            </p>
        </footer>

    </div>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Your Python -->
    <script type="py" src="main.py"></script>

</body>

</html>
