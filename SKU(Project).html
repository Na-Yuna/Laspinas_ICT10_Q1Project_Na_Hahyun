<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Human Market | SKU Generator</title>

    <!-- Favicon (PNG) -->
    <link rel="icon" type="image/png" href="Logo.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- PyScript -->
    <link rel="stylesheet"
          href="https://pyscript.net/releases/2025.2.2/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2025.2.2/core.js">
    </script>


    <style>
        /* Body */
        body {
            background: linear-gradient(135deg, #de3f3f, #ac1923);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Navigation */
        nav {
            background-color: #212529;
            height: 45px;
            padding: 0 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 12px;
        }

        .nav-links a:hover {
            color: #ff6b6b;
        }

        /* Main container */
        .container {
            padding-top: 50px;
            padding-bottom: 50px;
        }

        /* Main card */
        .main-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            max-width: 550px;
            margin: auto;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        /* Header */
        .header {
            background: #212529;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 5px;
        }

        /* Form */
        .form-label {
            font-weight: bold;
        }

        .form-control,
        .form-select {
            border-radius: 8px;
        }

        /* Button */
        .generate-button {
            background: linear-gradient(90deg, #de3f3f, #ac1923);
            border: none;
            color: white;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .generate-button:hover {
            opacity: 0.9;
        }

        /* SKU output */
        #sku_output {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }

        /* Footer */
        footer {
            text-align: center;
            color: white;
            margin-top: 30px;
        }
    </style>

</head>


<body>


    <!-- Navigation Bar -->
    <nav>
        <div class="logo">
            The Human Market
        </div>

        <div class="nav-links">
            <a href="Receipt(SKILLSTEST).html">
                ◉ Receipt Generator
            </a>
            
            <a href="SKU(Project).html">
                ▦ SKU Generator
            </a>
        </div>
    </nav>


    <!-- Main -->
    <div class="container">
        <div class="card main-card">

            <!-- Header -->
            <div class="header">
                <div><img src="barcode.png" alt="Logo" width="60" style="background-color: #fffefe; padding: 5px; margin-bottom: 10px;" class="img-fluid rounded"></div>
                <h1>SKU Generator</h1>
                <p class="mb-0">
                    The Human Market
                </p>
            </div>

            <!-- Form -->
            <div class="card-body p-4">

                <!-- Category -->
                <label for="category" class="form-label">
                    <img src="tag.png" alt="Category Icon" width="20" style="margin-right: 5px;">
                    Category
                </label>

                <select id="category" class="form-select mb-3">

                    <option value="Organs">
                        Organs
                    </option>

                    <option value="Tissues">
                        Tissues
                    </option>

                    <option value="Body Parts">
                        Body Parts
                    </option>
                </select>

                <!-- Product Name -->
                <label for="product_name" class="form-label">
                    <img src="box.png" alt="Product Icon" width="20" style="margin-right: 5px;">  
                    Product Name
                </label>

                <input type="text" id="product_name" class="form-control mb-3" placeholder="e.g. Human Heart">

                <!-- Stock Quantity -->
                <label for="quantity" class="form-label">
                    <img src="warehouse.png" alt="Stock Icon" width="20" style="margin-right: 5px;">
                    Stock Quantity
                </label>

                <input type="number" id="quantity" class="form-control" placeholder="e.g. 50">

                <!-- Generate Button -->
                <button class="generate-button" py-click="SKU_generator">
                    &nbsp; Generate SKU
                </button>

                <!-- Line -->
                <hr class="border-3 opacity-75">

                <!-- Output -->
                <div id="sku_output">
                    Your generated SKU will appear here.
                </div>

            </div>
        </div>

        <!-- Footer -->
        <footer>
            <p>
                &lt;/&gt; SKU Generator - 1st Quarter Project
            </p>
        </footer>

    </div>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Python -->
    <script type="py"
            src="main.py">
    </script>

</body>

</html>
